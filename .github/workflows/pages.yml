name: Pages

# Publishes the playground. Enable it once under Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A new push queues behind a running deployment
# instead of cancelling it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Test, build, and upload the site as the "github-pages" artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deploy in a separate job. deploy-pages looks the artifact up through the
  # API, which can lag behind an upload made moments earlier in the same job;
  # by the time a separate job starts, the artifact is listed reliably.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
